<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<title>crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafafa; --surface: #ffffff; --ink: #0b0b0c; --muted: #8a8a8f; --faint: #c7c7cc;
    --line: #efeff1; --line-strong: #e3e3e6;
    --free: #2fbf71; --free-bg: rgba(47, 191, 113, .11);
    --now: #ff3b30; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --hour: 48px; --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0c; --surface: #141416; --ink: #f5f5f7; --muted: #8a8a8f; --faint: #3a3a3e;
      --line: #1c1c1f; --line-strong: #26262a;
      --free-bg: rgba(47, 191, 113, .12);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 Inter, system-ui, -apple-system, sans-serif;
         font-feature-settings: "cv11", "ss01", "tnum"; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Header */
  header { position: sticky; top: 0; z-index: 10; padding: 16px 16px 12px;
           background: color-mix(in srgb, var(--bg) 82%, transparent);
           backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); }
  .bar { display: flex; align-items: center; gap: 12px; max-width: 1068px; margin: 0 auto; }
  .bar + .bar { margin-top: 18px; }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
  .brand .dots { display: flex; }
  .brand .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-left: -3px;
                   box-shadow: 0 0 0 2px var(--bg); }
  .brand .dots i:first-child { margin-left: 0; }
  .spacer { flex: 1; }
  .people { display: flex; align-items: center; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
            font-size: 12px; font-weight: 600; color: #fff; background: var(--c);
            box-shadow: 0 0 0 2px var(--bg); margin-left: -6px; transition: transform .15s; }
  .avatar:first-child { margin-left: 0; }
  .avatar:hover { transform: translateY(-2px); z-index: 1; }
  .avatar.me { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c); z-index: 1; }
  .new { height: 34px; padding: 0 14px; border-radius: 999px; background: var(--ink); color: var(--bg);
         font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
         transition: transform .15s, opacity .15s; }
  .new:hover { transform: scale(1.03); }
  .new:disabled { opacity: .3; transform: none; cursor: default; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.035em; line-height: 1.1; }
  h1 small { display: block; font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-top: 2px; }
  .nav { display: flex; align-items: center; gap: 4px; }
  .nav button { height: 32px; min-width: 32px; padding: 0 10px; border-radius: 999px; color: var(--muted);
                font-weight: 500; font-size: 13px; transition: background .15s, color .15s; }
  .nav button:hover { background: var(--line-strong); color: var(--ink); }
  .nav svg { width: 16px; height: 16px; display: block; }

  /* Banners + key */
  #banners, .key { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .banner { margin-top: 8px; padding: 10px 14px; border-radius: 12px; background: var(--surface);
            box-shadow: var(--shadow); font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .banner::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #ff9f0a; flex: none; }
  .key { display: flex; gap: 14px; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

  /* Grid */
  .wrap { max-width: 1100px; margin: 12px auto 40px; padding: 0 16px; }
  #grid { display: grid; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
  .dayhead { text-align: center; padding: 14px 0 12px; border-bottom: 1px solid var(--line); }
  .dayhead .dow { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase;
                  letter-spacing: .08em; color: var(--muted); }
  .dayhead .num { display: inline-grid; place-items: center; width: 32px; height: 32px; margin-top: 4px;
                  border-radius: 50%; font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
  .dayhead.today .num { background: var(--now); color: #fff; }
  .dayhead.today .dow { color: var(--now); }
  .times div { height: var(--hour); font-size: 10px; font-weight: 500; color: var(--faint); text-align: right;
               padding-right: 8px; transform: translateY(-7px); }
  .col { position: relative; border-left: 1px solid var(--line);
         background: repeating-linear-gradient(var(--line) 0 1px, transparent 1px var(--hour)); }
  .col > div { position: absolute; left: 0; right: 0; }
  .free { background: var(--free-bg); }
  .busy { background: var(--c); opacity: .22; border-radius: 8px; left: 4px !important; right: 4px !important; }
  .label { font-size: 11px; font-weight: 600; padding: 4px 9px; color: var(--c); line-height: 1.2;
           overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; z-index: 1; }
  .group { left: 4px !important; right: 4px !important; z-index: 2; cursor: pointer; overflow: hidden;
           background: var(--ink); color: var(--bg); border-radius: 8px; padding: 5px 8px;
           font-size: 12px; font-weight: 600; line-height: 1.25; box-shadow: 0 4px 12px rgba(0,0,0,.18);
           transition: transform .15s; }
  .group:hover { transform: scale(1.02); }
  .editable { touch-action: none; cursor: grab; }
  .label.editable:hover { outline: 1.5px dashed var(--c); outline-offset: -3px; border-radius: 8px; }
  .dragging { cursor: grabbing; z-index: 5 !important; opacity: .9; transition: none !important;
              box-shadow: 0 14px 32px rgba(0,0,0,.28); border-radius: 8px; }
  .label.dragging { background: var(--surface); outline: 1.5px solid var(--c); outline-offset: -3px; }
  .grip { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; cursor: ns-resize; }
  .grip::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 20px; height: 3px; margin-left: -10px;
                 border-radius: 2px; background: currentColor; opacity: 0; transition: opacity .15s; }
  .editable:hover .grip::after, .dragging .grip::after { opacity: .5; }
  .col { cursor: pointer; }
  .draft { left: 4px !important; right: 4px !important; border-radius: 8px; z-index: 4;
           border: 1.5px dashed var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .now { height: 2px !important; background: var(--now); z-index: 3; }
  .now::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px;
                 border-radius: 50%; background: var(--now); }

  /* Dialogs */
  dialog { border: 0; border-radius: 22px; background: var(--surface); color: var(--ink); padding: 24px;
           width: min(380px, calc(100vw - 32px)); box-shadow: 0 24px 64px rgba(0,0,0,.25); }
  dialog[open] { animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  dialog::backdrop { background: rgba(0,0,0,.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  dialog h2 { font-size: 20px; font-weight: 700; letter-spacing: -.025em; margin: 0 0 18px; }
  dialog form { display: grid; gap: 14px; }
  dialog label { display: grid; gap: 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
  select { font: inherit; color: var(--ink); background: var(--bg); border: 0; border-radius: 12px; padding: 11px 12px; width: 100%; appearance: none; }
  [hidden] { display: none !important; }
  input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid transparent;
          border-radius: 12px; padding: 11px 12px; width: 100%; transition: border-color .15s; }
  input:focus { outline: none; border-color: var(--line-strong); background: var(--surface); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; background: var(--bg); border-radius: 12px; }
  .seg input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
  .seg label { display: block; text-align: center; padding: 8px; border-radius: 9px; cursor: pointer;
               font-size: 13px; font-weight: 600; color: var(--muted); transition: background .15s, color .15s; }
  .seg input:checked + label { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  .btn { height: 44px; border-radius: 12px; font-weight: 600; background: var(--bg); }
  .btn.primary { background: var(--ink); color: var(--bg); }
  .btn:disabled { opacity: .5; }
  .btn.danger { color: var(--now); flex: 0 0 auto; padding: 0 16px; }
  .who-buttons { display: grid; gap: 8px; }
  .who-buttons button { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px;
                        background: var(--bg); font-weight: 600; transition: background .15s; }
  .who-buttons button:hover { background: var(--line-strong); }
  .who-buttons .avatar { margin: 0; box-shadow: none; }
  .err { color: var(--now); font-size: 13px; min-height: 1em; margin: 0; }

  @media (max-width: 699px) {
    h1 { font-size: 22px; }
    .wrap { padding: 0 8px; }
    #grid { border-radius: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="dots" id="dots"></span>crew</div>
    <span class="spacer"></span>
    <div class="people" id="people"></div>
    <button id="addBtn" class="new"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>New</button>
  </div>
  <div class="bar">
    <h1 id="range"></h1>
    <span class="spacer"></span>
    <div class="nav">
      <button id="today">Today</button>
      <button id="prev" aria-label="Previous"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="next" aria-label="Next"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</header>
<div class="key" id="legend"></div>
<div id="banners"></div>
<div class="wrap"><div id="grid"></div></div>

<dialog id="whoDialog">
  <h2>Who's this?</h2>
  <div class="who-buttons" id="whoButtons"></div>
</dialog>

<dialog id="addDialog">
  <h2 id="addTitle">New block</h2>
  <form id="addForm" method="dialog">
    <div class="seg">
      <input type="radio" name="type" id="tGroup" value="group" checked><label for="tGroup">Group plan</label>
      <input type="radio" name="type" id="tMe" value="me"><label for="tMe">Just me</label>
    </div>
    <label>Title <input name="what" maxlength="80" required placeholder="Dinner at Kinton" autocomplete="off"></label>
    <label>Date <input name="date" type="date" required></label>
    <div class="row">
      <label>Start <input name="start" type="time" required value="18:00"></label>
      <label>End <input name="end" type="time" required value="20:00"></label>
    </div>
    <div class="row">
      <label>Repeat
        <select name="repeat">
          <option value="">Never</option>
          <option value="day:1">Every day</option>
          <option value="week:1">Every week</option>
          <option value="week:2">Every 2 weeks</option>
          <option value="month:1">Every month</option>
        </select>
      </label>
      <label id="untilWrap">Ends
        <select name="ends"><option value="">Never</option><option value="on">On a date</option></select>
      </label>
    </div>
    <label id="untilDateWrap">Last day <input name="until" type="date"></label>
    <p class="err" id="addErr"></p>
    <div class="row">
      <button type="button" class="btn danger" id="addDelete" hidden>Delete</button>
      <button type="button" class="btn" id="addCancel">Cancel</button>
      <button class="btn primary" id="addSave">Save</button>
    </div>
  </form>
</dialog>

<dialog id="scopeDialog">
  <h2>Repeating block</h2>
  <div class="who-buttons">
    <button data-scope="one">Only this one</button>
    <button data-scope="all">All in the series</button>
    <button data-scope="">Cancel</button>
  </div>
</dialog>

<script type="module">
// ---- Config: fill these in (see README) ----
const PEOPLE = [
  { id: 'nathan', name: 'Nathan', color: '#ff5e3a' },
  { id: 'soohan', name: 'Soohan', color: '#2f7bff' },
  { id: 'ryan',   name: 'Ryan',   color: '#a259ff' },
];
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyAda51SxMO8S-nsgN7GpV_gEtGik9ESMNY',
  authDomain: 'calendar-5fc9f.firebaseapp.com',
  projectId: 'calendar-5fc9f',
  storageBucket: 'calendar-5fc9f.firebasestorage.app',
  messagingSenderId: '379133223990',
  appId: '1:379133223990:web:47024cee9eb92466a5a497',
};
// ---------------------------------------------

import { mergeIntervals, clip, freeSlots, dayRange, moveInterval, resizeInterval, occurrences, shiftSeries, slotAt } from './slots.js';

const START_HOUR = 8, END_HOUR = 24;
const phone = matchMedia('(max-width: 699px)');
const $ = id => document.getElementById(id);

const state = { me: null, viewStart: null, docs: [], blocks: [], draft: null };
const banners = {};

function store(key, value) {
  try { return value === undefined ? localStorage.getItem(key) : localStorage.setItem(key, value); }
  catch { return null; }
}

function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function startOfDay(d) { return addDays(d, 0); }
function mondayOf(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
function dayCount() { return phone.matches ? 3 : 7; }
function days() { return Array.from({ length: dayCount() }, (_, i) => addDays(state.viewStart, i)); }
function visibleRange() {
  const ds = days();
  return { start: dayRange(ds[0], START_HOUR, END_HOUR).start, end: dayRange(ds[ds.length - 1], START_HOUR, END_HOUR).end };
}
function person(id) { return PEOPLE.find(p => p.id === id); }

function setBanner(key, text) {
  if (text) banners[key] = text; else delete banners[key];
  $('banners').replaceChildren(...Object.values(banners).map(t => {
    const b = document.createElement('div'); b.className = 'banner'; b.textContent = t; return b;
  }));
}

// A person's busy time = their own "just me" blocks.
function busyFor(id) { return state.blocks.filter(b => b.who === id); }

function place(el, iv, range) {
  const span = range.end - range.start;
  el.style.top = ((iv.start - range.start) / span * 100) + '%';
  el.style.height = ((iv.end - iv.start) / span * 100) + '%';
  return el;
}
function div(cls, color) {
  const el = document.createElement('div');
  el.className = cls;
  if (color) el.style.setProperty('--c', color);
  return el;
}

function render() {
  if (drag) return; // don't swap elements out from under a drag; onDragEnd re-renders
  const ds = days(), today = startOfDay(new Date()).getTime();
  const first = ds[0], last = ds[ds.length - 1];
  const month = d => d.toLocaleDateString(undefined, { month: 'long' });
  const small = document.createElement('small');
  small.textContent = first.getFullYear();
  $('range').replaceChildren(month(first) === month(last)
    ? `${month(first)} ${first.getDate()}–${last.getDate()}`
    : `${month(first).slice(0, 3)} ${first.getDate()} – ${month(last).slice(0, 3)} ${last.getDate()}`, small);
  renderPeople();

  const grid = $('grid');
  grid.style.gridTemplateColumns = `44px repeat(${ds.length}, 1fr)`;
  const cells = [document.createElement('div')];
  for (const d of ds) {
    const h = div('dayhead' + (d.getTime() === today ? ' today' : ''));
    const dow = document.createElement('span'), num = document.createElement('span');
    dow.className = 'dow'; dow.textContent = d.toLocaleDateString(undefined, { weekday: 'short' });
    num.className = 'num'; num.textContent = d.getDate();
    h.append(dow, num);
    cells.push(h);
  }
  const times = div('times');
  for (let h = START_HOUR; h < END_HOUR; h++) {
    const t = document.createElement('div');
    t.textContent = h === START_HOUR ? '' : new Date(2000, 0, 1, h).toLocaleTimeString([], { hour: 'numeric' });
    times.append(t);
  }
  cells.push(times);

  for (const d of ds) {
    const range = dayRange(d, START_HOUR, END_HOUR);
    const col = div('col');
    // Click empty space (or someone's busy layer) -> new 1h block there
    col.onclick = e => {
      if (!fs || !['col', 'free', 'busy'].some(c => e.target.classList.contains(c))) return;
      openDialog(null, slotAt(range, (e.clientY - col.getBoundingClientRect().top) / col.offsetHeight));
    };
    col.style.height = `calc(var(--hour) * ${END_HOUR - START_HOUR})`;
    for (const f of freeSlots(PEOPLE.map(p => busyFor(p.id)), range.start, range.end))
      col.append(place(div('free'), f, range));
    for (const p of PEOPLE)
      for (const b of mergeIntervals(clip(busyFor(p.id) ?? [], range.start, range.end)))
        col.append(place(div('busy', p.color), b, range));
    for (const b of state.blocks) {
      const [iv] = clip([b], range.start, range.end);
      if (!iv) continue;
      const el = place(div(b.who === 'group' ? 'group' : 'label', person(b.who)?.color), iv, range);
      el.textContent = (b.doc.repeat ? '↻ ' : '') + b.title;
      el.title = b.who === 'group' ? b.title : `${person(b.who)?.name}: ${b.title}`;
      if (b.who === 'group' || b.who === state.me) {
        el.classList.add('editable');
        el.append(div('grip'));
        el.onpointerdown = e => startDrag(e, b, el);
      }
      col.append(el);
    }
    const [draft] = state.draft ? clip([state.draft], range.start, range.end) : [];
    if (draft) col.append(place(div('draft'), draft, range));
    const now = Date.now();
    if (now >= range.start && now < range.end) col.append(place(div('now'), { start: now, end: now }, range));
    cells.push(col);
  }
  grid.replaceChildren(...cells);
}

// ---- Shared blocks (Firestore) ----
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
let fs = null, unsubscribe = null;

async function initFirebase() {
  if (!FIREBASE_CONFIG.projectId) {
    $('addBtn').disabled = true;
    setBanner('blocks', 'Add the Firebase config in index.html to enable plans.');
    return;
  }
  const [{ initializeApp }, F] = await Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-firestore.js')]);
  fs = { ...F, db: F.getFirestore(initializeApp(FIREBASE_CONFIG)) };
}

// ponytail: loads every block that starts before the view ends (old ones included); add a lower bound if it ever gets slow
function subscribeBlocks() {
  if (!fs) return;
  unsubscribe?.();
  const range = visibleRange();
  const q = fs.query(fs.collection(fs.db, 'blocks'), fs.where('start', '<', fs.Timestamp.fromMillis(range.end)));
  unsubscribe = fs.onSnapshot(q, snap => {
    setBanner('blocks', null);
    state.docs = snap.docs.map(d => {
      const { start, end, ...rest } = d.data();
      return { ...rest, id: d.id, start: start.toMillis(), end: end.toMillis() };
    });
    expandBlocks();
    render();
  }, () => setBanner('blocks', "Couldn't load plans."));
}

// One entry per occurrence on screen; `doc` is the stored block (the series, if repeating).
function expandBlocks() {
  const range = visibleRange();
  state.blocks = state.docs.flatMap(doc =>
    occurrences(doc, range.start, range.end).map(o => ({ id: doc.id, who: doc.who, title: doc.title, ...o, doc })));
}

const ts = ms => fs.Timestamp.fromMillis(ms);
const ref = id => fs.doc(fs.db, 'blocks', id);

function askScope() {
  return new Promise(resolve => {
    const dlg = $('scopeDialog');
    dlg.querySelectorAll('button').forEach(btn => btn.onclick = () => { dlg.close(); resolve(btn.dataset.scope || null); });
    dlg.oncancel = () => resolve(null);
    dlg.showModal();
  });
}

// Write a change to one occurrence. scope 'one' on a series = skip that date + save a standalone copy.
async function saveChange(b, scope, fields) {
  const { repeat, ...rest } = fields;
  if (!b.doc.repeat) return fs.updateDoc(ref(b.id), { ...rest, ...(repeat !== undefined && { repeat: repeat ?? fs.deleteField() }) });
  if (scope === 'one') {
    await fs.addDoc(fs.collection(fs.db, 'blocks'), { who: b.who, title: b.title, start: ts(b.start), end: ts(b.end), ...rest });
    return fs.updateDoc(ref(b.id), { skip: fs.arrayUnion(b.occ) });
  }
  return fs.updateDoc(ref(b.id), { ...rest, ...(repeat !== undefined && { repeat: repeat ?? fs.deleteField() }) });
}

// ---- Drag to move / resize ----
const SNAP = 15 * 60000;
let drag = null;

function startDrag(e, b, el) {
  if (e.button) return;
  e.preventDefault();
  const cols = [...document.querySelectorAll('#grid .col')], col = el.parentElement, rect = col.getBoundingClientRect();
  drag = {
    b, el, x: e.clientX, y: e.clientY, h0: el.offsetHeight, moved: false,
    mode: e.target.classList.contains('grip') ? 'resize' : 'move',
    msPerPx: (END_HOUR - START_HOUR) * 3600000 / rect.height,
    colW: rect.width, colIdx: cols.indexOf(col), nCols: cols.length,
  };
  el.setPointerCapture(e.pointerId);
  el.onpointermove = onDragMove;
  el.onpointerup = el.onpointercancel = onDragEnd;
}

function dragDelta(e) {
  const ms = Math.round((e.clientY - drag.y) * drag.msPerPx / SNAP) * SNAP;
  const days = drag.mode === 'move'
    ? Math.max(-drag.colIdx, Math.min(drag.nCols - 1 - drag.colIdx, Math.round((e.clientX - drag.x) / drag.colW)))
    : 0;
  return { ms, days };
}

function onDragMove(e) {
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 5) return;
  drag.moved = true;
  drag.el.classList.add('dragging');
  const { ms, days } = dragDelta(e);
  if (drag.mode === 'move') drag.el.style.transform = `translate(${days * drag.colW}px, ${ms / drag.msPerPx}px)`;
  else drag.el.style.height = Math.max(SNAP / drag.msPerPx, drag.h0 + ms / drag.msPerPx) + 'px';
}

async function onDragEnd(e) {
  const { b, el, moved, mode } = drag, { ms, days } = dragDelta(e);
  el.onpointermove = el.onpointerup = el.onpointercancel = null;
  drag = null;
  if (!moved) return openEdit(b);
  const iv = mode === 'move' ? moveInterval(b, days, ms) : resizeInterval(b, ms);
  const scope = b.doc.repeat ? await askScope() : 'one';
  if (!scope) return render();
  const target = scope === 'all' ? shiftSeries(b.doc, b.occ, iv.start, iv.end) : iv;
  Object.assign(b, iv); // optimistic; the snapshot confirms
  render();
  try {
    await saveChange(b, scope, { start: ts(target.start), end: ts(target.end) });
  } catch {
    setBanner('save', "Couldn't save that change — try again.");
    subscribeBlocks(); // reload the real data
  }
}

// ---- Add / edit dialog ----
let editing = null;
const hhmm = t => new Date(t).toTimeString().slice(0, 5);

function openAdd() { openDialog(null); }
function openEdit(b) { openDialog(b); }

function openDialog(b, slot = null) {
  editing = b;
  state.draft = slot;
  if (slot) render();
  const f = $('addForm');
  $('addTitle').textContent = b ? 'Edit block' : 'New block';
  $('addDelete').hidden = !b;
  $('addErr').textContent = '';
  f.type.value = b && b.who !== 'group' ? 'me' : 'group';
  f.what.value = b?.title ?? '';
  const when = b ?? slot;
  f.date.value = new Date(when?.start ?? Date.now()).toLocaleDateString('en-CA'); // YYYY-MM-DD in local time
  f.start.value = when ? hhmm(when.start) : '18:00';
  f.end.value = when ? hhmm(when.end) : '20:00';
  const r = b?.doc.repeat;
  f.repeat.value = r ? `${r.every}:${r.n}` : '';
  f.ends.value = r?.until ? 'on' : '';
  f.until.value = r?.until ? new Date(r.until).toLocaleDateString('en-CA') : '';
  syncRepeatFields();
  $('addDialog').showModal();
}

function syncRepeatFields() {
  const f = $('addForm');
  $('untilWrap').hidden = !f.repeat.value;
  $('untilDateWrap').hidden = !f.repeat.value || f.ends.value !== 'on';
}
$('addForm').repeat.onchange = $('addForm').ends.onchange = syncRepeatFields;

$('addDelete').onclick = async () => {
  const b = editing;
  const scope = b.doc.repeat ? await askScope() : (confirm(`Delete “${b.title}”?`) && 'all');
  if (!scope) return;
  try {
    if (scope === 'one') await fs.updateDoc(ref(b.id), { skip: fs.arrayUnion(b.occ) });
    else await fs.deleteDoc(ref(b.id));
    $('addDialog').close();
  } catch { $('addErr').textContent = "Couldn't delete — try again."; }
};

$('addForm').onsubmit = async e => {
  e.preventDefault();
  const f = e.target, title = f.what.value.trim();
  const start = new Date(`${f.date.value}T${f.start.value}`);
  let end = new Date(`${f.date.value}T${f.end.value}`);
  if (f.end.value === '00:00') end = addDays(end, 1); // "until midnight"
  if (!title) return $('addErr').textContent = 'Add a title.';
  if (!(end > start)) return $('addErr').textContent = 'End must be after start.';
  if (f.type.value === 'me' && !state.me) return pickWho();
  const [every, n] = f.repeat.value.split(':');
  if (f.repeat.value && f.ends.value === 'on' && !f.until.value) return $('addErr').textContent = 'Pick the last day, or set Ends to Never.';
  const until = f.repeat.value && f.ends.value === 'on' ? new Date(`${f.until.value}T23:59:59`).getTime() : null;
  if (until && until < start) return $('addErr').textContent = 'Repeat end must be after the start.';
  const repeat = every ? { every, n: Number(n), ...(until && { until }) } : null;
  const scope = editing?.doc.repeat ? await askScope() : 'one';
  if (!scope) return;
  $('addSave').disabled = true;
  try {
    const who = f.type.value === 'group' ? 'group' : state.me;
    const when = scope === 'all' ? shiftSeries(editing.doc, editing.occ, start.getTime(), end.getTime())
                                 : { start: start.getTime(), end: end.getTime() };
    const data = { who, title, start: ts(when.start), end: ts(when.end) };
    if (!editing) await fs.addDoc(fs.collection(fs.db, 'blocks'), { ...data, ...(repeat && { repeat }) });
    else await saveChange(editing, scope, scope === 'one' && editing.doc.repeat ? data : { ...data, repeat });
    f.what.value = '';
    $('addDialog').close();
  } catch {
    $('addErr').textContent = "Couldn't save — try again.";
  } finally {
    $('addSave').disabled = false;
  }
};
$('addCancel').onclick = () => $('addDialog').close();
$('addDialog').addEventListener('close', () => { if (state.draft) { state.draft = null; render(); } });
$('addBtn').onclick = openAdd;

function refresh() {
  expandBlocks();
  render();
  subscribeBlocks();
}

function resetView() { state.viewStart = phone.matches ? startOfDay(new Date()) : mondayOf(new Date()); }

function pickWho() {
  $('whoButtons').replaceChildren(...PEOPLE.map(p => {
    const b = document.createElement('button');
    b.append(avatar(p, 'span'), p.name);
    b.onclick = () => { state.me = p.id; store('crewcal.me', p.id); $('whoDialog').close(); render(); };
    return b;
  }));
  $('whoDialog').showModal();
}

function avatar(p, tag = 'button') {
  const b = document.createElement(tag);
  b.className = 'avatar'; b.textContent = p.name[0]; b.title = p.name;
  b.style.setProperty('--c', p.color);
  return b;
}
function renderPeople() {
  $('people').replaceChildren(...PEOPLE.map(p => {
    const b = avatar(p);
    b.classList.toggle('me', p.id === state.me);
    b.title = p.id === state.me ? `${p.name} (you) — switch` : p.name;
    b.onclick = pickWho;
    return b;
  }));
}

$('dots').replaceChildren(...PEOPLE.map(p => {
  const i = document.createElement('i'); i.style.setProperty('--c', p.color); return i;
}));
$('legend').replaceChildren(...[...PEOPLE, { name: 'All free', color: 'var(--free)' }].map(p => {
  const s = document.createElement('span'), i = document.createElement('i');
  i.style.setProperty('--c', p.color);
  s.append(i, p.name);
  return s;
}));

$('prev').onclick = () => { state.viewStart = addDays(state.viewStart, -dayCount()); refresh(); };
$('next').onclick = () => { state.viewStart = addDays(state.viewStart, dayCount()); refresh(); };
$('today').onclick = () => { resetView(); refresh(); };
setInterval(render, 60_000); // keep the now-line moving
phone.addEventListener('change', () => { resetView(); refresh(); });

state.me = person(store('crewcal.me'))?.id ?? null;
resetView();
initFirebase().catch(() => setBanner('blocks', "Couldn't load plans.")).then(refresh);
if (!state.me) pickWho();
</script>
</body>
</html>
